<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#342820"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Unbound Days: a personal notebook calendar with tasks, goals, notes and a cover of your own.">
  <title>Unbound Days · Your planner</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=0.3.27">
</head>
<body>
  <header class="app-bar">
    <button class="brand" data-action="cover" aria-label="Close notebook and show cover"><span class="brand-symbol">u</span> unbound days<span class="beta">FIRST EDITION</span></button>
    <div class="bar-actions"><span id="save-status" role="status">Saved on this device</span><button class="icon-button" data-action="search" aria-label="Search planner">⌕</button><button class="icon-button" data-action="gallery" aria-label="Choose cover">▧</button><button class="icon-button" data-action="settings" aria-label="Settings">⚙</button><button class="icon-button fullscreen" data-action="fullscreen" aria-label="Full screen">⛶</button></div>
  </header>
  <main id="app"></main>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="cover-file" accept="image/png,image/jpeg,image/webp" hidden>
  <input type="file" id="backup-file" accept="application/json,.json" hidden>
  <script type="module" src="app.js?v=0.3.27"></script>
</body>
</html>
