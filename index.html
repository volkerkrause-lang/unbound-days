<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#342820"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Unbound: a personal notebook calendar with tasks, goals, notes and a cover of your own.">
  <title>Unbound · Your planner</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest"><link rel="preload" as="image" href="a_clean_warmly_lit_top_down_angled_overhead_stil.png" fetchpriority="high">
  <link rel="preload" as="image" href="assets/cover-00-premium-v3.webp" fetchpriority="high">
  <style id="boot-scene">body{background:#dfc49d url('a_clean_warmly_lit_top_down_angled_overhead_stil.png') center/cover fixed no-repeat}.boot-cover{background:#dfc49d url('a_clean_warmly_lit_top_down_angled_overhead_stil.png') center/cover no-repeat!important}.boot-cover .cover-book{z-index:1}.boot-cover .cover-open{visibility:visible!important;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0!important}.boot-cover .cover-year{font:500 clamp(70px,10vw,132px)/1.1 Georgia,serif;letter-spacing:.06em}.boot-cover .emboss-logo{position:absolute;bottom:60px;font:500 19px Georgia,serif;letter-spacing:3px}body:not(.app-ready) .cover-book:not(.boot-cover) .cover-inscription,body:not(.app-ready) .cover-book:not(.boot-cover) .cover-open{visibility:hidden}</style><link rel="stylesheet" href="styles.css?v=0.4.20">
</head>
<body>
  <header class="app-bar" inert>
    <button class="brand" data-action="cover" aria-label="Close notebook and show cover"><span class="brand-symbol">u</span> unbound<span class="beta">FIRST EDITION</span></button>
    <div class="bar-actions"><span id="save-status" role="status">Saved on this device</span><button class="icon-button" data-action="search" aria-label="Search planner">⌕<span class="mobile-search-label">Search</span></button><button class="icon-button" data-action="gallery" aria-label="Choose cover">▧</button><button class="icon-button" data-action="settings" aria-label="Settings">⚙</button></div>
  </header>
  <main id="app"><div class="cover-scene boot-cover" aria-hidden="true"><div class="cover-book" data-material="leather" data-cover="0"><div class="cover-art" style="background-image:url('assets/cover-00-premium-v3.webp');background-size:cover;background-position:center"></div><div class="page-block"></div><div class="cover-light"></div><div class="spine"></div><div class="cover-open"><span class="cover-year">2026</span><span class="emboss-logo">unbound</span></div></div></div></main>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="cover-file" accept="image/png,image/jpeg,image/webp" hidden>
  <input type="file" id="idea-paper-file" accept="image/png,image/jpeg,image/webp,application/pdf" hidden>
  <input type="file" id="backup-file" accept="application/json,.json" hidden>
  <script type="module" src="desk-background.js?v=21"></script>
  <script type="module" src="app.js?v=0.4.21"></script>
</body>
</html>
