name: Deploy Unbound development preview

on:
  push:
    branches:
      - development/account-foundation
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: unbound-development-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/development/account-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: unbound-development
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Cloudflare's existing Git integration deploys this branch. Verify its
      # commit-specific result rather than running a second credentialed deployer.
      - name: Verify Cloudflare Git preview deployment
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 36; attempt++) {
              const {data} = await github.rest.checks.listForRef({
                ...context.repo, ref: context.sha, check_name: 'Cloudflare Pages'
              });
              const check = data.check_runs.find(run => run.name === 'Cloudflare Pages');
              if (check?.status === 'completed') {
                if (check.conclusion !== 'success') {
                  throw new Error(`Cloudflare Git deployment failed: ${check.details_url}`);
                }
                const summary = check.output?.summary || '';
                const url = summary.match(/https:\/\/[a-f0-9]+\.unbound-development\.pages\.dev\b/)?.[0];
                if (!url) throw new Error('Cloudflare returned no isolated commit preview URL.');
                const response = await fetch(url);
                if (!response.ok || !(await response.text()).includes('id="app"')) {
                  throw new Error(`Preview did not serve the Unbound app: ${url}`);
                }
                const app = await fetch(`${url}/app.js`);
                if (!app.ok || !(app.headers.get('content-type') || '').includes('javascript')) {
                  throw new Error(`Preview app module is unavailable: ${url}/app.js`);
                }
                core.setOutput('url', url);
                await core.summary.addHeading('Development preview verified')
                  .addLink(context.sha, url)
                  .addRaw('\nCloudflare Git integration deployed this commit; HTML and app module checks passed.\n')
                  .write();
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Timed out waiting for the Cloudflare Pages check for this commit.');
