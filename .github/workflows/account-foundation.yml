name: Validate account foundation (no deployment)
on:
  push:
    branches: ['development/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify Classic & Clean mobile layout
        if: github.ref == 'refs/heads/development/classic-clean-mobile'
        run: |
          npx playwright install --with-deps chromium
          node server.mjs &
          node scripts/mobile-smoke.mjs
      - name: Save mobile browser result
        if: always() && github.ref == 'refs/heads/development/classic-clean-mobile'
        uses: actions/upload-artifact@v4
        with:
          name: classic-clean-mobile-browser
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: unbound-account-development
          path: _site/
