name: Validate account foundation (no deployment)
on:
  push:
    branches: ['development/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install browser for responsive checks
        if: startsWith(github.ref, 'refs/heads/development/')
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Verify browser regressions independently
        timeout-minutes: 20
        if: startsWith(github.ref, 'refs/heads/development/')
        run: |
          node server.mjs &
          failed=0
          run_check() {
            echo "::group::$1"
            shift
            if "$@"; then
              echo "PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              code=$?
              echo "::error::Browser check failed (exit $code): $*"
              echo "FAIL: $*" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_check "Account synchronisation" npm run test:browser:account
          run_check "Mobile layout" node scripts/mobile-smoke.mjs
          run_check "Cover artwork" node scripts/cover-artwork-audit.mjs
          run_check "Cover library" node scripts/cover-library-smoke.mjs
          run_check "Cover library iPad" env UNBOUND_DEVICE=ipad node scripts/cover-library-smoke.mjs
          run_check "Cover library portrait" env UNBOUND_DEVICE=portrait node scripts/cover-library-smoke.mjs
          run_check "Cover library mobile" env UNBOUND_DEVICE=mobile node scripts/cover-library-smoke.mjs
          run_check "Filofax" node scripts/filofax-smoke.mjs
          run_check "Responsive calendar" node scripts/calendar-responsive-smoke.mjs
          run_check "Template colours" node scripts/template-colours-smoke.mjs
          run_check "Polished forms" node scripts/polished-forms-smoke.mjs
          run_check "Dictation" node scripts/dictation-regression.mjs
          run_check "Mobile and dictation" node scripts/mobile-and-dictation-smoke.mjs
          run_check "Mobile refinements" node scripts/mobile-refinements-smoke.mjs
          run_check "Voice recorder" node scripts/voice-recorder-smoke.mjs
          run_check "Notebook stability desktop" env UNBOUND_DEVICE=desktop node scripts/notebook-stability-smoke.mjs
          exit "$failed"
      - name: Save mobile browser result
        if: always() && startsWith(github.ref, 'refs/heads/development/')
        uses: actions/upload-artifact@v4
        with:
          name: classic-clean-mobile-browser
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: unbound-account-development
          path: _site/
