name: Validate account foundation (no deployment)
on:
  push:
    branches: ['development/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install browser for responsive checks
        if: startsWith(github.ref, 'refs/heads/development/')
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Verify Classic & Clean mobile layout
        timeout-minutes: 15
        if: startsWith(github.ref, 'refs/heads/development/')
        run: |
          node server.mjs &
          npm run test:browser:account
          node scripts/mobile-smoke.mjs
          node scripts/cover-artwork-audit.mjs
          node scripts/cover-library-smoke.mjs
          UNBOUND_DEVICE=ipad node scripts/cover-library-smoke.mjs
          UNBOUND_DEVICE=portrait node scripts/cover-library-smoke.mjs
          UNBOUND_DEVICE=mobile node scripts/cover-library-smoke.mjs
          node scripts/filofax-smoke.mjs
          node scripts/calendar-responsive-smoke.mjs
          node scripts/template-colours-smoke.mjs
          node scripts/polished-forms-smoke.mjs
          node scripts/dictation-regression.mjs
          node scripts/mobile-and-dictation-smoke.mjs
          node scripts/mobile-refinements-smoke.mjs
          node scripts/voice-recorder-smoke.mjs
          UNBOUND_DEVICE=desktop node scripts/notebook-stability-smoke.mjs
      - name: Save mobile browser result
        if: always() && startsWith(github.ref, 'refs/heads/development/')
        uses: actions/upload-artifact@v4
        with:
          name: classic-clean-mobile-browser
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: unbound-account-development
          path: _site/
