name: Validate account foundation (no deployment)
on:
  push:
    branches: ['development/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify Classic & Clean mobile layout
        if: startsWith(github.ref, 'refs/heads/development/')
        run: |
          npx playwright install --with-deps chromium
          node server.mjs &
          node scripts/mobile-smoke.mjs
          node scripts/filofax-smoke.mjs
          node scripts/calendar-responsive-smoke.mjs
          node scripts/template-colours-smoke.mjs
          node scripts/voice-recorder-smoke.mjs
      - name: Save mobile browser result
        if: always() && startsWith(github.ref, 'refs/heads/development/')
        uses: actions/upload-artifact@v4
        with:
          name: classic-clean-mobile-browser
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: unbound-account-development
          path: _site/
